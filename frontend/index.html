<!doctype html>
<!--
  Research Desk — frontend markup.
  This file only defines the page skeleton (three columns: library, conversation, inspector).
  All behaviour lives in app.js and all styling in styles.css.
  FastAPI serves this file at "/" and the other two files under "/static/".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Research Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%230e5f5f'/%3E%3Crect x='10' y='12' width='12' height='5' fill='%23f6d96b'/%3E%3Crect x='10' y='20' width='8' height='2' fill='%23fff' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#composerInput">Skip to question box</a>

  <div class="app" id="app" data-left="open" data-right="open">

    <!-- LEFT: reports and conversations -->
    <aside class="rail rail-left" id="railLeft" aria-label="Reports and conversations">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <div class="brand-text">
          <strong>Research Desk</strong>
          <span>Annual report analysis</span>
        </div>
        <button class="icon-btn only-narrow" id="closeLeft" aria-label="Close sidebar"></button>
      </div>

      <button class="btn btn-primary btn-block" id="newChat"></button>

      <section class="block" aria-labelledby="libTitle">
        <header class="block-head">
          <h2 id="libTitle">Reports</h2>
          <span class="block-meta" id="libCount"></span>
        </header>

        <label class="dropzone" id="dropzone" for="fileInput">
          <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
          <span class="dz-icon" id="dzIcon"></span>
          <span class="dz-text"><strong>Add a PDF report</strong><small>Drop a file here or browse. Pages become searchable with citations.</small></span>
        </label>

        <div class="search-field" id="docFilterWrap" hidden>
          <input type="search" id="docFilter" placeholder="Filter reports" aria-label="Filter reports" autocomplete="off">
        </div>

        <ul class="doc-list" id="docList" aria-live="polite"></ul>
      </section>

      <section class="block block-grow" aria-labelledby="convTitle">
        <header class="block-head">
          <h2 id="convTitle">Conversations</h2>
        </header>
        <ul class="conv-list" id="convList"></ul>
      </section>

      <footer class="rail-foot">
        <div class="health" id="health" role="status"></div>
        <button class="btn btn-quiet btn-sm" id="reindexBtn" title="Rebuild the vector index from stored text. PDFs are not parsed again."></button>
      </footer>
    </aside>

    <!-- CENTER: conversation -->
    <main class="stage" id="stage">
      <header class="stage-bar">
        <button class="icon-btn only-narrow" id="openLeft" aria-label="Open reports and conversations"></button>
        <div class="stage-title">
          <h1 id="threadTitle">New conversation</h1>
          <div class="scope" id="scopeLine"></div>
        </div>

        <div class="segmented" role="radiogroup" aria-label="Research mode" id="modeSwitch">
          <button role="radio" aria-checked="true" data-mode="agent" title="The agent searches repeatedly, reads pages and checks numbers before answering. Slower, more thorough.">Agent</button>
          <button role="radio" aria-checked="false" data-mode="pipeline" title="One retrieval step and one answer. Faster and cheaper.">Single pass</button>
        </div>
        <button class="icon-btn only-narrow" id="openRight" aria-label="Open inspector"></button>
      </header>

      <div class="scroller" id="scroller" tabindex="-1">
        <div class="thread" id="thread"></div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="composerInput" rows="1" placeholder="Ask about a report, or compare several" aria-label="Your question" maxlength="4000"></textarea>
          <div class="composer-row">
            <div class="composer-scope">
              <label for="scopeSelect">Search in</label>
              <select id="scopeSelect"></select>
            </div>
            <span class="composer-hint" id="composerHint">Enter to send · Shift+Enter for a new line</span>
            <button type="submit" class="send" id="sendBtn" aria-label="Send question"></button>
          </div>
        </div>
      </form>
    </main>

    <!-- RIGHT: inspector -->
    <aside class="rail rail-right" id="inspector" aria-label="Inspector">
      <div class="tabs" role="tablist" aria-label="Inspector sections">
        <button role="tab" id="tab-source" aria-controls="panel-source" aria-selected="true" data-tab="source">Source</button>
        <button role="tab" id="tab-activity" aria-controls="panel-activity" aria-selected="false" data-tab="activity">Research steps</button>
        <button role="tab" id="tab-usage" aria-controls="panel-usage" aria-selected="false" data-tab="usage">Usage</button>
        <button class="icon-btn only-narrow" id="closeRight" aria-label="Close inspector"></button>
      </div>
      <div class="panel" id="panel-source" role="tabpanel" aria-labelledby="tab-source"></div>
      <div class="panel" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" hidden></div>
      <div class="panel" id="panel-usage" role="tabpanel" aria-labelledby="tab-usage" hidden></div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>
  </div>

  <dialog class="dialog" id="confirmDialog">
    <form method="dialog">
      <h3 id="confirmTitle"></h3>
      <p id="confirmBody"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn btn-danger" value="ok" id="confirmOk"></button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
