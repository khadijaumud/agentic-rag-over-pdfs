services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  rag-app:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      - path: starter/.env
        required: false
    environment:
      DATA_DIR: /app/data
      DB_PATH: /app/data/rag_database.db
      PDF_DIR: /app/data/pdfs
      VECTOR_DB_URL: http://qdrant:6333
    volumes:
      - app_data:/app/data
      - app_runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
  app_runs:
  qdrant_data:
